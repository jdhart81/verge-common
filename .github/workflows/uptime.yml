name: Production monitor
# BL-07: outages reach the owner without depending on the Mac.
# Every 15 minutes: /healthz must answer {"status":"ok"} over HTTPS.
# Nightly: the full launch gate must pass against the latest release tag.
# A failure opens (or comments on) one GitHub issue labelled "production-alert",
# which GitHub emails to repository watchers; recovery closes it.
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full launch gate
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: https://vergecommon.com
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Health check (three attempts)
        id: health
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 20 "$ORIGIN/healthz") && echo "$body" | grep -q '"status":"ok"' && { echo "$body"; exit 0; }
            sleep 20
          done
          echo "Health check failed: ${body:-no response}"
          exit 1
      - name: Full launch gate
        id: gate
        if: github.event.schedule == '17 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.full)
        continue-on-error: true
        run: |
          set -o pipefail
          release=$(git describe --tags --abbrev=0 --match 'v*')
          node scripts/launch-gate.mjs --origin "$ORIGIN" --expect-commit "$(git rev-parse --short "$release^{commit}")" | tee gate.txt
      - name: Update alerts
        if: always()
        env:
          HEALTH: ${{ steps.health.outcome }}
          GATE: ${{ steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          now=$(date -u +%FT%TZ)
          alert() { # label title detail
            gh label create "$1" --color B60205 --description "Automated production monitor" 2>/dev/null || true
            existing=$(gh issue list --label "$1" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "Still failing at $now. $3"
            else gh issue create --label "$1" --title "$2" --body "Failed at $now. $3

          Runbook: STATUS.md and self-hosted/README.md. Run the v0.9.0 rollback compatibility guard before restarting a pre-v0.9.0 writer. If new participation records exist, retain current data and ship a compatibility/forward repair. Never restore an old backup over live data."; fi
          }
          resolve() { # label
            for n in $(gh issue list --label "$1" --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Recovered at $now ($RUN_URL)."
            done
          }
          failed=0
          if [ "$HEALTH" = failure ]; then alert alert-health "Production down: vergecommon.com health check failing" "Run: $RUN_URL"; failed=1
          elif [ "$HEALTH" = success ]; then resolve alert-health; fi
          if [ "$GATE" = failure ]; then
            detail="Run: $RUN_URL"
            [ -f gate.txt ] && detail="$detail"$'\n\n```\n'"$(grep -E '^FAIL' gate.txt | head -20)"$'\n```'
            alert alert-launch-gate "Launch gate failing on vergecommon.com" "$detail"; failed=1
          elif [ "$GATE" = success ]; then resolve alert-launch-gate; fi
          exit $failed
