name: Community checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate:local
      - name: HTTP persistence and file checks
        run: |
          npm run dev > /tmp/verge-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/network > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http_integration.py

  imagery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/imagery/requirements.txt
      - run: pip install -r workers/imagery/requirements.txt
      - run: python workers/imagery/test_processor.py
      - run: python workers/imagery/test_fetch.py
